<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Asteroids</title>
	<style>
		* { margin: 0; box-sizing: border-box; }
		body { background: #0a0a12; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #e0e0e0; font-family: sans-serif; }
		#wrap { position: relative; }
		#canvas { display: block; background: #0a0a12; border: 1px solid #333; }
		#ui { position: absolute; top: 8px; left: 8px; display: flex; gap: 16px; pointer-events: none; }
		#score { font-size: 18px; }
		#lives { font-size: 18px; }
	</style>
</head>
<body>
	<div id="wrap">
		<canvas id="canvas" width="800" height="600"></canvas>
		<div id="ui">
			<span id="score">Очки: 0</span>
			<span id="lives">Жизни: 3</span>
		</div>
	</div>
	<script type="module" src="./asteroids/main.ts"></script>
</body>
</html>
