<!doctype html>
<html lang="ru">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Potions — зельеварение</title>
	<link rel="stylesheet" href="./style.css">
</head>

<body>
	<div class="page">
		<header class="page-header">
			<h1 class="page-title">Potions</h1>
			<div class="page-header-right">
				<button type="button" id="btn-new-game" class="btn btn-primary">
					Новая игра
				</button>
			</div>
		</header>

		<div class="canvas-wrapper">
			<canvas id="canvas" width="1200" height="640"></canvas>
		</div>

		<div id="overlay" class="overlay" hidden>
			<div class="overlay-card">
				<h2 id="overlay-title" class="overlay-title"></h2>
				<p id="overlay-text" class="overlay-text"></p>
				<div class="overlay-actions">
					<button type="button" id="btn-restart" class="btn btn-primary">
						Сыграть ещё раз
					</button>
					<button type="button" id="btn-close" class="btn btn-secondary">
						Закрыть
					</button>
				</div>
			</div>
		</div>
	</div>

	<script type="module" src="./main.ts"></script>
</body>

</html>
